server {
  listen 80;
  client_max_body_size 32m;
  resolver 127.0.0.11 valid=10s;
  proxy_hide_header Access-Control-Allow-Origin;
  add_header Access-Control-Allow-Origin '*' always;
  add_header Access-Control-Allow-Headers 'Content-Type, Authorization, Range' always;
  add_header Access-Control-Allow-Methods 'GET, HEAD, POST, PUT, DELETE, OPTIONS' always;
  if ($request_method = OPTIONS) { return 204; }
  location /segmentation/ { set $upstream pcg:8000; proxy_pass http://$upstream; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_read_timeout 180s; }
  location /meshing/ { set $upstream pcg:8000; proxy_pass http://$upstream; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_read_timeout 180s; }
  location /image/ {
    __IMAGE_LOCATION__
  }
  location /info/ { set $upstream info:8000; proxy_pass http://$upstream; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /schema/ { set $upstream schema:8000; proxy_pass http://$upstream; }
  location /annotation/ { set $upstream annotation:8000; proxy_pass http://$upstream; }
  location /materialize/ { set $upstream materialize:8000; proxy_pass http://$upstream; proxy_read_timeout 180s; }
  location /data/ {
    alias /data/;
    gzip_static on;
  }
  location /viewer/ { alias /viewer/; }
  location / { root /web; add_header Cache-Control 'no-cache' always; try_files $uri $uri/ =404; }
}
