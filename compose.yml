# Template only. Use bin/cave create; do not operate this file directly.
name: cave-pkg-template
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}
services:
  bigtable:
    <<: *common
    build: {context: ., dockerfile: docker/bigtable.Dockerfile}
    volumes: [bigtable:/data]
    mem_limit: 8g
    cpus: 2
  redis:
    <<: *common
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      retries: 5
    mem_limit: 1g
  pcg:
    <<: *common
    build: {context: ., dockerfile: docker/pcg.Dockerfile}
    environment:
      BIGTABLE_EMULATOR_HOST: bigtable:9000
      BIGTABLE_PROJECT: cave-local
      BIGTABLE_INSTANCE: brain2
      PROJECT_ID: cave-local
      PCG_GRAPH_IDS: brain2
      APP_SETTINGS: config.pcg
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONPATH: /workspace:/workspace/scripts
      AUTH_DISABLED: "true"
    volumes:
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/data
    entrypoint: [gunicorn]
    command: [--bind, "0.0.0.0:8000", --workers, "2", --threads, "2", --timeout, "180", --pythonpath, /workspace/scripts, "wsgi:app"]
    depends_on: [bigtable, redis]
    mem_limit: 16g
    cpus: 4
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/segmentation/table/brain2/info',timeout=10).read()"]
      interval: 30s
      start_period: 60s
      retries: 3
  gateway:
    <<: *common
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
      - ./web:/web:ro
    depends_on: [pcg]
    mem_limit: 256m
  postgres:
    <<: *common
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: cave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-cave.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cave -d postgres"]
      interval: 5s
      retries: 30
    mem_limit: 4g
    cpus: 2
  info:
    <<: *common
    image: caveconnectome/annotationframeworkinfoservice:v4.3.4
    environment: &cave-env
      AUTH_DISABLED: "true"
      CAVE_SERVICE: info
      UWSGI_INI: /workspace/config/empty.ini
      UWSGI_CHEAPER: "0"
      SERVICE_DATABASE: datasets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CAVE_SESSION_SECRET: ${CAVE_SESSION_SECRET}
      ANNOTATIONINFOSERVICE_SETTINGS: /workspace/config/common.py
      EMANNOTATION_SCHEMA_SETTINGS: /workspace/config/common.py
      ANNOTATION_ENGINE_SETTINGS: /workspace/config/common.py
      MATERIALIZATION_ENGINE_SETTINGS: /workspace/config/common.py
      GLOBAL_SERVER_URL: http://gateway
      LOCAL_SERVER_URL: http://gateway
      PCG_SERVER_URL: http://gateway
      PYTHONPATH: /app:/workspace:/workspace/scripts
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      QUEUE_LENGTH_LIMIT: "10000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    volumes: &cave-mounts
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/data
      - ./secrets:/root/.cloudvolume/secrets:ro
    entrypoint: [uwsgi]
    command: &cave-command [--http, "0.0.0.0:8000", --master, --processes, "2", --threads, "2", --wsgi-file, /workspace/scripts/wsgi.py, --callable, app, --need-app, --die-on-term, --harakiri, "180"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/info/health',timeout=10).read()"]
      interval: 30s
      start_period: 60s
      retries: 3
  schema:
    <<: *common
    image: caveconnectome/emannotationschemas:v5.26.3
    environment:
      <<: *cave-env
      CAVE_SERVICE: schema
    volumes: *cave-mounts
    entrypoint: [uwsgi]
    command: *cave-command
    mem_limit: 1g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/schema/versions',timeout=10).read()"]
      interval: 30s
      start_period: 60s
      retries: 3
  annotation:
    <<: *common
    image: caveconnectome/annotationengine:v4.41.6
    environment:
      <<: *cave-env
      CAVE_SERVICE: annotation
      SERVICE_DATABASE: annotation
    volumes: *cave-mounts
    entrypoint: [uwsgi]
    command: *cave-command
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/annotation/api/versions',timeout=10).read()"]
      interval: 30s
      start_period: 60s
      retries: 3
  materialize:
    <<: *common
    image: caveconnectome/materializationengine:v5.28.0
    environment: &mat-env
      <<: *cave-env
      CAVE_SERVICE: materialize
      SERVICE_DATABASE: materialize
    volumes: *cave-mounts
    entrypoint: [uwsgi]
    command: *cave-command
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/materialize/api/versions',timeout=10).read()"]
      interval: 30s
      start_period: 60s
      retries: 3
  mat-worker:
    <<: *common
    image: caveconnectome/materializationengine:v5.28.0
    environment: *mat-env
    volumes: *cave-mounts
    entrypoint: [celery]
    command: [--workdir=/workspace/scripts, -A, celery_app:celery, worker, --pool=prefork, --concurrency=4, -Q, "celery,process,workflow,orchestration,deltalake", --loglevel=INFO]
    depends_on: [redis, materialize]
    mem_limit: 6g
    cpus: 2
volumes:
  bigtable:
  redis:
  postgres:
